stages:
  - lint
  - test
  - build

variables:
  GO_VERSION: "1.26.3"
  POSTGRES_DB: postchi
  POSTGRES_USER: postchi
  POSTGRES_PASSWORD: postchi

lint:backend:
  stage: lint
  image: golang:${GO_VERSION}
  script:
    - cd backend
    - go vet ./...
    - go build ./...

test:backend:
  stage: test
  image: golang:${GO_VERSION}
  services:
    - name: postgres:16
      alias: database
  variables:
    DATABASE_URL: postgres://postchi:postchi@database:5432/postchi?sslmode=disable
    MIGRATIONS_PATH: file://../migrations
    AUTO_MIGRATE: "true"
    DB_READY_TIMEOUT: 60s
  script:
    - cd backend
    - go test ./... -count=1
    - go build -o /tmp/postchi-migrate ./cmd/migrate
    - /tmp/postchi-migrate

build:docker:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t postchi-api -f backend/Dockerfile .
    - docker build -t postchi-web -f frontend/Dockerfile .
  only:
    - main
    - tags
